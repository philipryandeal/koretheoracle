name: Validate Kore Matrix

on:
  pull_request:
    paths:
      - 'matrix/**'
      - 'scripts/build-matrix.js'
      - 'index.html'
      - 'egbe/**'
      - 'field-notes/**'
      - 'games/**'
      - 'manifesto.html'
      - 'llms.txt'
      - 'ORACLE_RECORD.md'
      - 'server.js'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/matrix.yml'
  push:
    branches: [main]
    paths:
      - 'matrix/**'
      - 'scripts/build-matrix.js'
      - 'index.html'
      - 'egbe/**'
      - 'field-notes/**'
      - 'games/**'
      - 'manifesto.html'
      - 'llms.txt'
      - 'ORACLE_RECORD.md'
      - 'server.js'
      - 'tests/**'
      - 'package*.json'
      - '.github/workflows/matrix.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run sanctuary integrity tests
        run: npm test
